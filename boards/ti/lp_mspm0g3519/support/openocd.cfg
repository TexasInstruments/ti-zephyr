source [find interface/xds110.cfg]
adapter speed 10000

proc _mspm0g3519_custom_reset_assert {} {
	global ::reset_halt_requested
	if {[info exists ::reset_halt_requested]} {
		set reset_halt $::reset_halt_requested
	} else {
		set reset_halt 0
	}

	if {$reset_halt} {
		$::_CHIPNAME.dap apreg 4 0x00 0x110008
	} else {
		$::_CHIPNAME.dap apreg 4 0x00 0x104008
	}
	$::_CHIPNAME.dap apreg 4 0xF0 0x01
	$::_CHIPNAME.dap apreg 4 0x00 0x100008
}

proc _mspm0g3519_install_reset_wrapper {} {
	if {[info commands ocd_process_reset_original] ne ""} {
		return
	}

	rename ocd_process_reset ocd_process_reset_original

	proc ocd_process_reset {MODE} {
		global ::reset_halt_requested
		global ::mspm0g3519_srst_mode_requested

		if {$MODE == "halt" || $MODE == "init"} {
			set ::reset_halt_requested 1
		} else {
			set ::reset_halt_requested 0
		}

		if {[info exists ::mspm0g3519_srst_mode_requested] && $::mspm0g3519_srst_mode_requested} {
			${::_TARGETNAME} configure -event reset-assert {}
			return [ocd_process_reset_original $MODE]
		} elseif {$::reset_halt_requested} {
			${::_TARGETNAME} configure -event reset-assert { _mspm0g3519_custom_reset_assert }
			return [ocd_process_reset_original $MODE]
		} else {
			# reset run: use SRST — clears entire debug domain (DPREC reset to 000b)
			# so ROM boots user flash instead of entering Wait-for-Debug
			${::_TARGETNAME} configure -event reset-assert {}
			set saved_config [reset_config]
			reset_config srst_only
			catch {ocd_process_reset_original $MODE}
			eval reset_config $saved_config
			return 0
		}
	}
}

lappend post_init_commands _mspm0g3519_install_reset_wrapper

source [find target/ti_mspm0.cfg]

proc mspm0_board_reset {} {
	global ::mspm0g3519_srst_mode_requested
	set ::mspm0g3519_srst_mode_requested 1

	set user_reset_config [reset_config]
	reset_config srst_only
	set errno [catch {reset}]

	set ::mspm0g3519_srst_mode_requested 0

	eval reset_config $user_reset_config
	if {$errno} {error}
}
