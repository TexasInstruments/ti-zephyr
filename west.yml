# The projects list below is a hand-picked set of TI-relevant entries.
manifest:
  version: "1.2"
  defaults:
    remote: zephyrproject
  remotes:
  - name: zephyrproject
    url-base: https://github.com/zephyrproject-rtos
  - name: TexasInstruments
    url-base: https://github.com/TexasInstruments

  projects:
  - name: hal_ti
    remote: TexasInstruments
    path: modules/hal/ti
    revision: 11dd68a2e3ba8cfe0d7a5753f33c75f81d5dc5a4
  - name: trusted-firmware-a
    remote: TexasInstruments
    repo-path: arm-trusted-firmware
    path: modules/tee/tf-a/trusted-firmware-a
    revision: b54338ab6ee648bb9bef2e9dab7550a9a1d11d54
  - name: zephyr
    remote: TexasInstruments
    path: zephyr
    revision: v4.4.0-ti-next
    import:
      name-allowlist:
      - cmsis
      - cmsis_6
      - cmsis-dsp
      - cmsis-nn
      - fatfs
      - liblc3
      - libmetal
      - libsbc
      - littlefs
      - lvgl
      - mbedtls
      - mipi-sys-t
      - mldsa-native
      - mcuboot
      - net-tools
      - open-amp
      - openthread
      - picolibc
      - tf-psa-crypto
      - trusted-firmware-m
      - zcbor
  self:
    path: ti-zephyr
    west-commands: scripts/west-commands.yml
