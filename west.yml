# The projects list below is a hand-picked set of TI-relevant entries.
manifest:
  version: "1.2"
  defaults:
    remote: zephyrproject
  remotes:
  - name: zephyrproject
    url-base: https://github.com/zephyrproject-rtos
  - name: TexasInstruments
    url-base: https://github.com/TexasInstruments

  projects:
  - name: mcuboot
    remote: TexasInstruments
    path: bootloader/mcuboot
    revision: 96576b341ee19f1c3af6622256b0d4f3d408e1e3
  - name: zephyr
    remote: TexasInstruments
    path: zephyr
    revision: v4.4.0-ti-next
    import:
      name-allowlist:
      - cmsis
      - cmsis_6
      - cmsis-dsp
      - cmsis-nn
      - fatfs
      - hal_ti
      - liblc3
      - libmetal
      - libsbc
      - littlefs
      - lvgl
      - mbedtls
      - net-tools
      - open-amp
      - openthread
      - picolibc
      - trusted-firmware-a
      - trusted-firmware-m
      - zcbor
  self:
    path: ti-zephyr
    west-commands: scripts/west-commands.yml
