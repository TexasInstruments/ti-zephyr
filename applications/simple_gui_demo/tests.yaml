sample:
  name: Simple GUI demo
  description: Minimal reference for the gui_composer module -- counters and a
    switch streamed over UART, no sensors.
tests:
  sample.gui_composer.simple_gui_demo.msgpack:
    tags:
      - gui_composer
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3507
  sample.gui_composer.simple_gui_demo.json:
    tags:
      - gui_composer
    extra_configs:
      - CONFIG_GUI_COMPOSER_PROTOCOL_JSON=y
      - CONFIG_GUI_COMPOSER_PROTOCOL_MSGPACK=n
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3507
