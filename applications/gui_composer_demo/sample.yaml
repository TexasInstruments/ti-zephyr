sample:
  name: GUI Composer OOB demo
  description: MSPM0 out-of-box GUI Composer demo -- blink, light sensor,
    thermistor, function generator, and internal temperature modes, matching TI's baremetal
    reference experience per board (see README.rst for which modes run
    on which board).
tests:
  sample.gui_composer.demo:
    tags:
      - gui_composer
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    harness: console
    harness_config:
      type: one_line
      regex:
        - ".*\\[gui_composer_demo\\] boot"
