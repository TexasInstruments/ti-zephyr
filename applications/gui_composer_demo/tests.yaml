sample:
  name: GUI Composer OOB demo
  description: MSPM0 out-of-box GUI Composer demo -- blink, light sensor,
    thermistor, and function generator modes, matching TI's baremetal
    reference experience per board (see README.rst for which modes run
    on which board).
tests:
  sample.gui_composer.demo:
    tags:
      - gui_composer
    platform_allow:
      - lp_mspm0g3507
    integration_platforms:
      - lp_mspm0g3507
    harness: console
    harness_config:
      type: one_line
      regex:
        - ".*\\[gui_composer_demo\\] boot"
