sample:
  name: RTC Temperature LCD Multi-State Monitor
  description: >
    Multi-state temperature monitor for LP-MSPM0L2228. Three display
    states (TEMP / TIME / DATE) cycled via two push-buttons with
    auto-return after 10 s inactivity. ADC thread samples die temperature
    every 1 s with WARMING/COOLING event detection and periodic min/max
    summary logged to UART. LCD refreshes at 250 ms. RTC seeded from
    build timestamp; CONFIG_RTC_CALIBRATION supported for LFOSC
    drift compensation. Demonstrates ADC, RTC, auxdisplay, GPIO, and HWINFO.

tests:
  applications.rtc_temp_lcd:
    build_only: true
    platform_allow:
      - lp_mspm0l2228
    tags:
      - adc
      - rtc
      - auxdisplay
      - gpio
      - hwinfo
      - mspm0
    integration_platforms:
      - lp_mspm0l2228
