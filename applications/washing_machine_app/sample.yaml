sample:
  name: TI MSPM33 LVGL Washing Machine UI
  description: >
    Washing-machine LVGL UI with Waveshare 3.5" RPi LCD (F) display on the
    LP-MSPM33C321A LaunchPad.
tests:
  application.washing_machine_app:
    tags:
      - lvgl
      - display
      - gui
    harness: none
    extra_args: SHIELD=waveshare_3_5_rpi_lcd_f
    platform_allow:
      - lp_mspm33c321a
