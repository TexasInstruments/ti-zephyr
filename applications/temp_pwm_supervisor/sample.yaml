sample:
  name: Temperature-Controlled PWM with Watchdog Supervision
  description: >
    Five-peripheral MSPM0 control loop: ADC die temperature → PWM LED
    brightness, supervised by a window watchdog. Demonstrates
    counter_set_top_value, center-aligned PWM, WWDT window mode, and
    HWINFO reset-cause detection in a single application.

tests:
  applications.temp_pwm_supervisor:
    build_only: true
    platform_allow:
      - lp_mspm0l2228
      - lp_mspm0g3507
      - lp_mspm0g3519
    tags:
      - adc
      - pwm
      - counter
      - watchdog
      - hwinfo
      - mspm0
    integration_platforms:
      - lp_mspm0l2228
