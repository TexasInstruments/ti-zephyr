name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build samples/tests for lp_mspm0g3519
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ti-zephyr
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: ti-zephyr
          toolchains: arm-zephyr-eabi

      - name: Checkpatch
        working-directory: ti-zephyr
        run: |
          # github.event.before is all-zero on a branch's first push,
          # and orphaned after a force-push.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          git diff --no-ext-diff "$base"..HEAD | ../zephyr/scripts/checkpatch.pl \
            --mailback --no-tree --ignore SPDX_LICENSE_TAG -

      - name: Build firmware
        working-directory: ti-zephyr
        run: |
          west twister -p lp_mspm0g3519 -T samples -T tests -v --inline-logs
