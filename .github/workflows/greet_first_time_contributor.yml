name: Greet first time contributor

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  check_for_first_interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'TexasInstruments/ti-zephyr'
    permissions:
      pull-requests: write # to comment on pull requests
      issues: write        # to comment on issues

    steps:
      - uses: actions/first-interaction@3c71ce730280171fd1cfb57c00c774f8998586f7 # v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          issue_message: >
            Thanks for opening your first issue on ti-zephyr! Someone
            from the team will take a look soon.

          pr_message: >
            Thanks for your first pull request to ti-zephyr!


            CI will run automatically. If checks fail, please amend
            the problematic commit and force-push the fix rather than
            adding a new commit on top — see
            [Zephyr's contribution guidelines](https://docs.zephyrproject.org/latest/contribute/guidelines.html)
            for the commit conventions this repo follows.
