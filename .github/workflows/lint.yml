name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint + clang-format + gitlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ti-zephyr
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout zephyr style/rule files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TexasInstruments/zephyr
          ref: v4.4.0-ti
          path: zephyr
          sparse-checkout: |
            .yamllint
            .clang-format
            scripts/gitlint
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install yamllint and gitlint
        run: pip install yamllint gitlint

      - name: Run yamllint
        working-directory: ti-zephyr
        run: |
          other_yaml=$(git ls-files '*.yml' '*.yaml' | grep -v '^\.github/' || true)
          github_yaml=$(git ls-files '.github/**/*.yml' '.github/**/*.yaml')

          if [ -n "$other_yaml" ]; then
            yamllint --strict -c ../zephyr/.yamllint $other_yaml
          fi
          if [ -n "$github_yaml" ]; then
            yamllint --strict -d "extends: ../zephyr/.yamllint
          rules:
            line-length: disable" $github_yaml
          fi

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run clang-format check
        working-directory: ti-zephyr
        run: |
          files=$(git ls-files '*.c' '*.h')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror --style=file:../zephyr/.clang-format $files
          else
            echo "0 C source files found, skipping."
          fi

      - name: Run gitlint
        working-directory: ti-zephyr
        run: |
          # github.sha on pull_request is a synthetic merge commit, not
          # the branch HEAD. github.event.before is all-zero on a
          # branch's first push, and orphaned after a force-push.
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse "$head~1" 2>/dev/null || git rev-list --max-parents=0 "$head")
          fi
          gitlint --commits "$base..$head"
