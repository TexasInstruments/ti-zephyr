name: "Close stale pull requests/issues"
on:
  schedule:
    - cron: "16 00 * * *"

permissions:
  contents: read

jobs:
  stale:
    name: Find Stale issues and PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'TexasInstruments/ti-zephyr'
    permissions:
      pull-requests: write # to comment on stale pull requests
      issues: write        # to comment on stale issues

    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          stale-pr-message: 'This pull request is flagged stale: 30 days have passed
            since the last update. Remove the stale label or comment to keep it
            open; it closes automatically 7 days from now. Ask a maintainer to
            reopen it for you afterward if needed.'
          stale-issue-message: 'This issue is flagged stale: 30 days have passed
            since the last update. Remove the stale label or comment to keep it
            open; it closes automatically 7 days from now. You can always reopen
            a closed issue later.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'Stale'
          stale-pr-label: 'Stale'
          exempt-pr-labels: 'Blocked,In progress'
          exempt-issue-labels: 'In progress,Enhancement'
          operations-per-run: 400
