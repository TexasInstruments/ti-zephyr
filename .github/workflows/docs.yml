name: Documentation

# Builds the Sphinx docs once per SoC family and publishes them to GitHub
# Pages from the gh-pages branch:
#   next         -> https://<owner>.github.io/<repo>/<soc>/
#   pull request -> https://<owner>.github.io/<repo>/pr-preview/pr-<N>/<soc>/
# PR previews are only deployed for branches in this repository; PRs from
# forks get a read-only token, so they are built and uploaded as an artifact.

on:
  push:
    branches:
      - next
    paths:
      - 'doc/**'
      - 'samples/**/*.rst'
      - 'tests/**/*.rst'
      - 'applications/**/*.rst'
      - '.github/workflows/docs.yml'
      - '.github/workflows/generate_docs_index.py'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - 'doc/**'
      - 'samples/**/*.rst'
      - 'tests/**/*.rst'
      - 'applications/**/*.rst'
      - '.github/workflows/docs.yml'
      - '.github/workflows/generate_docs_index.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  socs:
    name: List SoC families
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: doc/socs.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # doc/socs.json is the single list of SoC families (also read by
      # doc/conf.py and the landing page generator).
      - name: Read SoC families
        id: list
        run: |
          echo "matrix=$(python3 -c "import json; print(json.dumps(list(json.load(open('doc/socs.json')))))")" >> "$GITHUB_OUTPUT"

  build:
    name: Build docs (${{ matrix.soc }})
    needs: socs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.socs.outputs.matrix) }}
    steps:
      - name: Install west
        run: pip install west

      - name: Initialize west manifest
        run: |
          west init -m https://github.com/TexasInstruments/ti-zephyr.git --mr next .
          west update
          cd ti-zephyr
          git checkout ${{ github.event.pull_request.head.ref || github.ref_name }}
          cp -r zephyr/doc ti-zephyr/doc_zephyr || true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install doc requirements
        run: pip install -r doc/requirements.txt

      - name: Build HTML
        run: cd ti-zephyr && make html SOC=${{ matrix.soc }} SPHINXOPTS="-W --keep-going"

      - name: Upload HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: html-${{ matrix.soc }}
          path: docs
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout landing page generator and logo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            .github/workflows/generate_docs_index.py
            doc/_static/ti_logo.png
            doc/socs.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: html-*
          path: site

      - name: Download manifest files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifests
          path: site

      # download-artifact keeps each artifact's name as a subdirectory
      # (site/html-mspm0/, ...) - rename to the bare SoC name (site/mspm0/).
      - name: Flatten per-SoC directories
        run: |
          for d in site/html-*; do
            mv "$d" "site/${d#site/html-}"
          done

      - name: Generate landing page
        run: python3 .github/workflows/generate_docs_index.py site doc/_static/ti_logo.png doc/socs.json

      - name: Disable Jekyll
        run: |
          touch site/.nojekyll
          ls site

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Pages
    needs: assemble
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          commit-message: "Deploy docs from ${{ github.sha }}"

  preview:
    name: Deploy PR preview
    needs: assemble
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site

      # Pages runs Jekyll unless .nojekyll is at the branch root, which drops
      # Sphinx's _static/ and _sources/. The next deploy writes it, but a PR
      # can be previewed before next has ever been published.
      - name: Prepare .nojekyll
        run: mkdir nojekyll && touch nojekyll/.nojekyll

      - name: Ensure .nojekyll at gh-pages root
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: nojekyll
          branch: gh-pages
          clean: false
          commit-message: "Add .nojekyll"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: deploy
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          deploy-commit-message: "Deploy docs preview for PR #${{ github.event.number }}"
          remove-commit-message: "Remove docs preview for PR #${{ github.event.number }}"

  preview-remove:
    name: Remove PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          deploy-commit-message: "Deploy docs preview for PR #${{ github.event.number }}"
          remove-commit-message: "Remove docs preview for PR #${{ github.event.number }}"
