sample:
  name: TI Blinky
  description: Blink an LED on TI LaunchPad boards.
tests:
  sample.blinky:
    tags:
      - LED
      - GPIO
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Booting Zephyr OS"
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3519
