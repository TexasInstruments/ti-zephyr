sample:
  name: RTC-Timestamped Temperature Logger with LCD Display
  description: >
    Four-peripheral MSPM0 temperature monitor: ADC die temperature read
    every second, RTC elapsed timestamp, live update of onboard 14-segment
    LCD, and UART log with WARMING/COOLING event detection and periodic
    min/max/cur summary. Demonstrates ADC (internal 1.4V VREF), RTC
    (always-on VBAT domain), auxdisplay segment LCD, and HWINFO.

tests:
  applications.rtc_temp_lcd:
    build_only: true
    platform_allow:
      - lp_mspm0l2228
    tags:
      - adc
      - rtc
      - auxdisplay
      - hwinfo
      - mspm0
    integration_platforms:
      - lp_mspm0l2228
