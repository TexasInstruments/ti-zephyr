sample:
  name: I2C Temperature Read
  description: >
    Reads the temperature from a TMP10x-compatible I2C temperature sensor at
    address 0x48 using raw I2C transfers, and prints ten samples in degrees
    Celsius.
common:
  tags:
    - drivers
    - i2c
    - ti
  depends_on:
    - i2c
  filter: dt_nodelabel_enabled("main_i2c1")
tests:
  sample.drivers.i2c.i2c_temperature_read:
    platform_allow:
      - am62l_evm/am62l3/a53
    harness: console
    harness_config:
      type: one_line
      regex:
        - "All test passed"
