sample:
  name: EQEP Position and Speed Measurement
  description: >
    Measure simulated rotary encoder position and speed using the TI EQEP counter
    driver, with a quadrature pair generated by a single EHRPWM instance's two
    channels (one using the TI_EHRPWM_USE_AQ_SET_ZRO_PRD action-qualifier flag), and
    the index signal looped back from a GPIO.
common:
  tags:
    - drivers
    - counter
    - pwm
  depends_on: counter
tests:
  sample.drivers.counter.eqep_position_speed:
    platform_allow:
      - am62l_evm/am62l3/a53
    build_only: true
