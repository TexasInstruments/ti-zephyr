sample:
  name: TI UART Echo
  description: Echo characters received over UART on TI LaunchPad boards.
tests:
  sample.uart_echo:
    tags:
      - UART
    harness: console
    harness_config:
      type: one_line
      regex:
        - "UART echo ready"
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3519
