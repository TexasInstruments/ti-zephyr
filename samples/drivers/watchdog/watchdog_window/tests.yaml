sample:
  name: TI MSPM0 WWDT Window Mode
  description: >
    Demonstrates the MSPM0 Window Watchdog Timer (WWDT) closed-window
    constraint. Feeds correctly inside the open window, then deliberately
    feeds too early to trigger a SYSRST. On reboot, SYSCTL.RSTCAUSE
    (read-to-clear) reports SYSWWDT0, confirming the violation. The upstream watchdog sample
    sets WDT_MIN_WINDOW=0 for MSPM0; this sample exercises min > 0.
common:
  tags:
    - drivers
    - watchdog
    - ti
  depends_on: watchdog
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "TI MSPM0 WWDT Window Mode"
      - "WWDT window:.*min=[0-9]+ ms.*max=[0-9]+ ms"
      - "Phase 1:"
      - "Feed 1/[0-9]+:.*OK"
      - "expects SYSRST"
tests:
  sample.drivers.watchdog.window:
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
      - lp_mspm33c321a
      - lp_am13e230
    timeout: 15
