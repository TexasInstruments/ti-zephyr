sample:
  name: TI ADC Read
  description: Read ADC channels on TI LaunchPad boards.
tests:
  sample.adc_read:
    tags:
      - ADC
    harness: console
    harness_config:
      type: one_line
      regex:
        - "ADC ch0:"
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3519
