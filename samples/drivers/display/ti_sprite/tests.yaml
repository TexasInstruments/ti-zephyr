sample:
  name: TI DSS Sprite Animation
  description: >
    Renders a TI logo sprite that slides in a serpentine (boustrophedon)
    pattern across the full display, using the non-blocking, VSYNC-callback
    driven path of the TI DSS (tidss) display driver. The display refresh
    rate is the sole pacing mechanism; no k_msleep() is used.
common:
  tags:
    - drivers
    - display
    - ti
  depends_on: display
tests:
  sample.drivers.display.ti_sprite.dsi_rpi_panel:
    platform_allow:
      - am62l_evm/am62l3/a53
    build_only: true
  sample.drivers.display.ti_sprite.dpi_hdmi:
    platform_allow:
      - am62l_evm/am62l3/a53
    extra_args: DTC_OVERLAY_FILE="boards/am62l_evm_am62l3_a53_hdmi.overlay"
    build_only: true
