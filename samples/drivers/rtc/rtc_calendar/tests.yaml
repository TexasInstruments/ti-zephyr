sample:
  name: TI MSPM0 RTC Calendar
  description: >
    Demonstrates the Zephyr RTC driver API on TI MSPM0 LaunchPad boards.
    Sets the calendar date/time, configures an alarm, and (on boards with the
    extended RTCX peripheral) registers interval-timer and prescaler-timer
    callbacks. Reads back the time once per second when CONFIG_RTC_UPDATE is
    not enabled.
common:
  tags:
    - drivers
    - rtc
    - ti
  depends_on: rtc
  harness: console
  harness_config:
    type: one_line
    regex:
      - "RTC date and time: 2026-09-07 04:19:0[0-9]"
tests:
  sample.drivers.rtc.rtc_calendar:
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    timeout: 30
