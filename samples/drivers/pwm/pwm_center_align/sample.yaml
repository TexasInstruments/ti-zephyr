sample:
  name: TI PWM Center-Aligned Mode
  description: >
    Demonstrates center-aligned (up-down counting) PWM mode configured via
    the TI-specific 'ti,pwm-mode = "CENTER_ALIGN"' DTS property.
    The driver activates CCUPD_ZERO_LOAD_EVT shadow latching in this mode,
    providing glitch-free duty updates at both timer zero-crossing and peak.
common:
  tags:
    - drivers
    - pwm
    - ti
  depends_on: pwm
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "TI PWM - Center-Aligned Mode"
      - "LOAD register: ([0-9]+) cycles"
      - "CCUPD_ZERO_LOAD_EVT"
      - "duty= *10%"
      - "duty= *90%"
      - "Shadow-latch confirmed"
      - "Done"
tests:
  sample.drivers.pwm.center_align:
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
      - lp_mspm33c321a
    timeout: 20
