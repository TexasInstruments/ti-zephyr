sample:
  name: AM62L ECAP APWM Mode
  description: >
    Generate a PWM waveform using the TI eCAP peripheral's Auxiliary PWM (APWM)
    mode on AM62L, driving main_ecap0 at 1000 Hz with a 50% duty cycle for 10
    seconds using the standard PWM API before stopping the output.
common:
  tags:
    - drivers
    - pwm
tests:
  sample.drivers.pwm.ecap_apwm:
    platform_allow:
      - am62l_evm/am62l3/a53
    build_only: true
